services:
  - type: web
    name: dharma-campaignreport
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:render
    envVars:
      - key: FACEBOOK_SYSTEM_ACCESS_TOKEN
        sync: false
      - key: RESPOND_IO_ACCESS_TOKEN
        sync: false
      - key: RESPOND_IO_ANALYTICS_ACCESS_TOKEN
        sync: false
      - key: AIRCALL_API_ID
        sync: false
      - key: AIRCALL_API_TOKEN
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY2_CLIENT_ID
        sync: false
      - key: SHOPIFY2_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        sync: false
      - key: META_USER_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: AD_ACCOUNT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: AIRCALL_WEBHOOK_TOKEN
        sync: false
